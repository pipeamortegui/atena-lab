<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Generador de la insignia de la firma de correo (firma/insignia-atena-lab.png).
     Se fotografía con Chrome sin cabeza a 420x420 px (3x de 140 px). -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .insignia {
    width: 420px; height: 420px; box-sizing: border-box;
    background: #000; border-radius: 30px; overflow: hidden;
    position: relative;
  }
  .onda {
    position: absolute; left: 14px; top: 62px;
    width: 392px; height: auto; display: block;
  }
  .logo {
    position: absolute; left: 60px; top: 306px;
    width: 300px; height: auto; display: block;
  }
</style>
</head>
<body>
  <div class="insignia">
    <img class="onda" src="onda-recorte.png" alt="">
    <img class="logo" src="../../assets/marca/logo-atena-lab.svg" alt="">
  </div>
</body>
</html>
